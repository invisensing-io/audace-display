name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run tests
        env:
          MPLBACKEND: Agg          # headless matplotlib (no display on CI)
        run: pytest -q

  # The pyqtgraph backend: tests/test_plotting_qt.py skips without the
  # `interactive` extra, so the job above never runs it.
  test-interactive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install package + test and interactive deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,interactive]

      - name: Run tests (Qt offscreen)
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
